<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Density — AI coding agent for Android.">
  <title>Density</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root { color-scheme: dark; --bg:#000000; --fg:#ffffff; --font:"Sora",sans-serif; }
    * { box-sizing:border-box; }
    html,body { width:100%; min-height:100%; margin:0; background:var(--bg); }
    body { min-height:100svh; color:var(--fg); font-family:var(--font); -webkit-font-smoothing:antialiased; }
    a,button { -webkit-tap-highlight-color:transparent; }
    .page { min-height:100svh; position:relative; isolation:isolate; overflow:hidden; display:grid; grid-template-rows:1fr; background:var(--bg); }
    .topbar { position:absolute; top:0; left:0; right:0; z-index:5; padding:28px clamp(22px,5vw,68px); display:flex; align-items:center; justify-content:space-between; }
    .brand { display:inline-flex; align-items:center; gap:10px; color:var(--fg); text-decoration:none; }
    .brand-icon { width:25px; height:28px; display:block; flex:none; }
    .brand-icon svg { display:block; width:100%; height:100%; }
    .brand-name { font-size:19px; font-weight:600; letter-spacing:-.055em; }
    .menu-wrap { position:relative; }
    .menu-button { width:38px; height:38px; display:grid; place-items:center; padding:0; color:var(--fg); background:transparent; border:1px solid transparent; border-radius:0; cursor:pointer; }
    .menu-button:hover,.menu-button[aria-expanded="true"] { background:#000000; border-color:#ffffff; }
    .menu-button svg { width:19px; height:19px; stroke-width:1.7; }
    .menu { position:absolute; top:46px; right:0; width:174px; display:none; padding:5px; border:1px solid #ffffff; border-radius:0; background:#000000; }
    .menu.open { display:grid; }
    .menu a { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 10px; border-radius:3px; color:#ffffff; font-size:11px; font-weight:500; text-decoration:none; }
    .menu a:hover { color:#000000; background:#ffffff; }
    .menu a svg { width:13px; height:13px; opacity:1; }
    .hero { min-height:100svh; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:100px 20px 50px; }
    h1 { margin:0; color:#ffffff; font-size:clamp(46px,9vw,108px); font-weight:700; line-height:1.04; letter-spacing:-.085em; }
    .actions { display:flex; align-items:center; justify-content:center; gap:9px; margin-top:31px; flex-wrap:wrap; }
    .button { min-height:46px; display:inline-flex; align-items:center; justify-content:center; gap:9px; padding:0 22px; border:1px solid #ffffff; border-radius:0; color:#ffffff; background:#000000; text-decoration:none; font-size:12px; font-weight:600; white-space:nowrap; transition:background .14s ease,color .14s ease; }
    .button svg { width:14px; height:14px; stroke-width:1.8; }
    .button-secondary:hover { color:#000000; background:#ffffff; }
    .button-primary { color:#000000; background:#ffffff; border-color:#ffffff; }
    .button-primary:hover { color:#ffffff; background:#000000; }
    @media(max-width:520px) {
      .topbar { padding:21px 20px; }
      .hero { padding:90px 18px 42px; }
      h1 { font-size:clamp(38px,10.2vw,68px); letter-spacing:-.075em; }
      .actions { margin-top:25px; gap:7px; }
      .button { min-height:44px; padding:0 17px; }
    }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; } }
  </style>
</head>
<body>
  <div class="page" id="home">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Density home">
        <span class="brand-icon"><svg xmlns="http://www.w3.org/2000/svg" width="1673" height="1854" viewBox="0 0 361 400">
  <path
    fill="#ffffff"
    fill-rule="evenodd"
    d="M266.5 19Q288 1 296.5 8.5Q305 16 315.5 31Q326 46 341.5 81Q357 116 358.5 125Q360 134 347.5 150.5Q335 167 331.5 188.5Q328 210 331.5 224Q335 238 346.5 255Q358 272 342.5 308Q327 344 315.5 360.5Q304 377 293 388Q282 399 263.5 383.5Q245 368 227.5 344.5Q210 321 197 286.5Q184 252 181.5 224Q179 196 184 165.5Q189 135 200 109Q211 83 228 60Q245 37 266.5 19ZM49.5 65Q70 39 89.5 55.5Q109 72 124 93.5Q139 115 149 142.5Q159 170 161.5 196Q164 222 160 248.5Q156 275 146.5 298.5Q137 322 122 343Q107 364 85 381.5Q63 399 49 381.5Q35 364 26.5 349Q18 334 9 307Q0 280 10.5 267Q21 254 25 240.5Q29 227 28 211.5Q27 196 22 184.5Q17 173 10 165Q3 157 3.5 152.5Q4 148 16.5 119.5Q29 91 49.5 65Z"
  />
</svg></span>
        <span class="brand-name">density</span>
      </a>
      <div class="menu-wrap">
        <button class="menu-button" id="menuButton" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="siteMenu"><i data-lucide="menu"></i></button>
        <nav class="menu" id="siteMenu" aria-label="Legal links">
          <a href="./privacy/">Privacy Policy <i data-lucide="arrow-up-right"></i></a>
          <a href="./terms/">Terms <i data-lucide="arrow-up-right"></i></a>
        </nav>
      </div>
    </header>
    <main class="hero">
      <h1>Density v0.1.0</h1>
      <div class="actions">
        <a class="button button-secondary" href="mailto:densityapp@proton.me">Contact <i data-lucide="mail"></i></a>
        <a class="button button-primary" href="https://github.com/rayanmtk/density/releases/latest" target="_blank" rel="noopener noreferrer">Download <i data-lucide="arrow-down-to-line"></i></a>
      </div>
    </main>
  </div>
  <script>
    (() => {
      const button = document.getElementById('menuButton');
      const menu = document.getElementById('siteMenu');
      const closeMenu = () => {
        menu.classList.remove('open');
        button.setAttribute('aria-expanded','false');
        button.setAttribute('aria-label','Open menu');
        button.innerHTML = '<i data-lucide="menu"></i>';
        if (window.lucide) window.lucide.createIcons();
      };
      button.addEventListener('click', () => {
        const open = menu.classList.toggle('open');
        button.setAttribute('aria-expanded', String(open));
        button.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        button.innerHTML = open ? '<i data-lucide="x"></i>' : '<i data-lucide="menu"></i>';
        if (window.lucide) window.lucide.createIcons();
      });
      document.addEventListener('click', event => {
        if (!menu.contains(event.target) && !button.contains(event.target)) closeMenu();
      });
      document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenu(); });
      if (window.lucide) window.lucide.createIcons();
    })();
  </script>
</body>
</html>
